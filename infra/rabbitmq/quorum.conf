# RabbitMQ de la región (ADR-002). Las colas de los servicios son quorum (packages/comun/src/broker.ts).
# Con el perfil ha, cuando entran los nodos 2 y 3 cada cola suma réplicas hasta tener 3, aunque se
# haya creado con un solo nodo: si uno falla no se pierden eventos (QA-1, QA-5).
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 10000
