# Lo que no pertenece a ninguna región (Vista de despliegue, Iteración 6). Se levanta una sola vez,
# antes que las regiones, con npm run infra:levantar (proyecto "global").
#
# Crea la red global (trotamundos-global), que conecta:
# - el enrutador global con el nginx de cada región (nginx-region-1, nginx-region-2);
# - el anonimizador de cada región (servicio analitica) con la base de analítica;
# - correo e integraciones de cada región con los mocks de los sistemas externos.
# Las bases de cada región no están en esta red (CONST-6).
#
# Todavía no existen, y se agregan acá cuando se programen:
# - procesadores Map-Reduce (parte de Analítica): fase 3 de Analítica;
# - mocks de aerolínea, hotel, rentadora, agencia y red social (mocks/*): P2.

services:
  # Enrutador global (Iteración 6, ADR-017): el único punto de entrada de la web. Manda cada
  # solicitud al nginx de la región del usuario por la red global. Las regiones se levantan después:
  # mientras no estén, responde 503.
  enrutador:
    image: trotamundos/enrutador:dev
    build: { context: .., dockerfile: services/enrutador/Dockerfile }
    restart: unless-stopped
    networks: [global]
    ports: ['${PUERTO_ENRUTADOR:-8000}:8000']
    environment:
      NIVEL_LOG: ${NIVEL_LOG:-info}
      URL_REGION_1: http://nginx-region-1:8080
      URL_REGION_2: http://nginx-region-2:8080
      REGION_POR_DEFECTO: ${REGION_POR_DEFECTO:-region-1}

  # Mock de Gmail (specs/externos/gmail.md, P2.B1): OAuth de Google, Gmail API y avisos push. Publica
  # el 4001 porque el navegador del usuario abre su pantalla de permiso. Cada región tiene su tópico
  # de Pub/Sub, y el aviso entra por el enrutador global con el prefijo de su región.
  mock-gmail:
    image: trotamundos/mock-gmail:dev
    build: { context: .., dockerfile: mocks/gmail/Dockerfile }
    restart: unless-stopped
    networks: [global]
    ports: ['${PUERTO_MOCK_GMAIL:-4001}:4001']
    environment:
      NIVEL_LOG: ${NIVEL_LOG:-info}
      CLIENT_SECRET: ${SECRETO_CLIENTE_GMAIL:?}
      SUSCRIPCIONES_PUSH: >-
        projects/trotamundos/topics/gmail-avisos-region-1=http://enrutador:8000/region-1/api/correo/notificaciones/gmail?token=${SECRETO_AVISOS_GMAIL:?},projects/trotamundos/topics/gmail-avisos-region-2=http://enrutador:8000/region-2/api/correo/notificaciones/gmail?token=${SECRETO_AVISOS_GMAIL:?}

  # Mock de Outlook (specs/externos/outlook.md, P2.B2): Microsoft identity platform y Microsoft Graph.
  # Publica el 4002 porque el navegador abre su pantalla de permiso. Las change notifications van a la
  # notificationUrl que cada región pone al crear la suscripción.
  mock-outlook:
    image: trotamundos/mock-outlook:dev
    build: { context: .., dockerfile: mocks/outlook/Dockerfile }
    restart: unless-stopped
    networks: [global]
    ports: ['${PUERTO_MOCK_OUTLOOK:-4002}:4002']
    environment:
      NIVEL_LOG: ${NIVEL_LOG:-info}
      CLIENT_SECRET: ${SECRETO_CLIENTE_OUTLOOK:?}

  # Base de analítica (Iteración 6): una sola, con el histórico anonimizado de todas las regiones.
  # No guarda datos personales, por eso puede estar en una sola región sin incumplir CONST-6.
  postgres-analitica:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [global]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${CLAVE_BD_ADMIN:?}
      BASES: analitica:analitica
      CLAVE_BD_ANALITICA: ${CLAVE_BD_ANALITICA_GLOBAL:?}
    volumes:
      - postgres-analitica:/var/lib/postgresql/data
      - ./postgres/crear-bases.sh:/docker-entrypoint-initdb.d/10-crear-bases.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U admin -d postgres]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

networks:
  global:
    name: trotamundos-global

volumes:
  postgres-analitica:
