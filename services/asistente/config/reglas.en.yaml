problemasMenores:
  equipaje:
    palabrasClave:
      - baggage
      - luggage
      - suitcase
      - bag
      - carry on
    respuesta: >-
      You can bring one cabin bag up to 8 kg. Checked baggage depends on your fare; you can verify
      it in your booking confirmation email.
  checkIn:
    palabrasClave:
      - check-in
      - checkin
      - check in
      - boarding pass
      - seat
    respuesta: >-
      Online check-in usually opens 24 to 48 hours before departure on your airline website using
      your booking reference.
  compartir:
    palabrasClave:
      - share
      - sharing
      - designated
      - social network
    respuesta: >-
      You can share a trip from its detail page in the dashboard: add a designated person's email
      for read-only access, or post your itinerary to your social network without booking codes.
  archivar:
    palabrasClave:
      - archive
      - archiving
      - archived
      - past trips
    respuesta: >-
      You don't need to archive trips manually: they are archived automatically once their last
      booking has ended (during the nightly job) and appear read-only under the Archived tab.
  correo:
    palabrasClave:
      - connect email
      - sync email
      - gmail
      - outlook
      - mailbox
    respuesta: >-
      From the Email tab you can connect Gmail or Outlook with read-only OAuth access. Trotamundos
      detects bookings automatically and never stores your email password.
  whitelist:
    palabrasClave:
      - whitelist
      - filter
      - filters
      - sender
      - senders
    respuesta: >-
      In the Whitelist tab you can enable sender filters and choose which email addresses or domains
      are allowed when scanning your inbox.
  offline:
    palabrasClave:
      - offline
      - no internet
      - airplane mode
    respuesta: >-
      Trotamundos caches your latest dashboard locally on your device so you can still check your
      active bookings even without an internet connection.
  gestionManual:
    palabrasClave:
      - add booking
      - create booking
      - edit booking
      - delete booking
    respuesta: >-
      On the Dashboard you can add a booking manually and edit or delete existing ones directly from
      each booking card.
  quienSos:
    palabrasClave:
      - who are you
      - what can you do
      - what do you do
    respuesta: >-
      Hi! I'm the Trotamundos virtual assistant. I can check your booking status, look for flight
      rescheduling options, answer questions about baggage, check-in, email sync or archived trips,
      or escalate your case to your travel agency.
  comoEstas:
    palabrasClave:
      - how are you
      - how is it going
    respuesta: >-
      I'm doing great, thanks for asking! How can I help you with your trips or bookings today?
  despedida:
    palabrasClave:
      - bye
      - goodbye
      - see you
    respuesta: >-
      See you later! Safe travels, and feel free to message me anytime if you need help with your
      bookings.
  gracias:
    palabrasClave:
      - thanks
      - thank you
      - thx
      - great
      - awesome
      - perfect
    respuesta: >-
      You're welcome! Let me know if you need to check another booking, reschedule a flight, or
      contact your travel agency.
  saludo:
    palabrasClave:
      - hi
      - hello
      - hey
      - good morning
      - good afternoon
      - good evening
    respuesta: >-
      Hi! How can I help you today? You can ask about your trip status, reschedule a flight, ask
      about baggage or check-in, or request to talk to your travel agency.
  general:
    palabrasClave:
      - help
    respuesta: >-
      I can check your booking status, look for flight rescheduling options, answer questions about
      baggage, check-in, email sync, whitelist or archived trips, or escalate your case to your
      travel agency.

textos:
  saludo: Hi, I'm the Trotamundos assistant. How can I help you?
  repregunta: >-
    I didn't quite catch that. You can ask about your trip or flight status, reschedule a flight,
    ask about baggage or check-in, or ask me to connect you with your agency.
  derivacionAutomaticaMotivo: >-
    The assistant could not understand the user's request after two consecutive attempts.
  sinReservas: I couldn't find any active bookings in your account right now.
  reservaNoEncontrada: I couldn't find booking {numeroReserva} among your active trips.
  estadoEncabezado: 'Here are your active bookings:'
  estadoUnicaReserva: 'Your {tipo} {numeroReserva} ({ruta}) starts on {inicio} and is {estado}.'
  pedirNumeroReprogramacion: >-
    You have multiple active bookings. Please share the booking reference for the flight you want to
    reschedule (for example: {ejemplo}).
  reprogramacionSinReservas: I couldn't find any active bookings to reschedule in your account.
  opcionesEncontradas: The airline offers these options. Which one would you like to confirm?
  sinOpcionesReprogramacion: >-
    No rescheduling options are available from the provider for {numeroReserva}. Would you like me
    to escalate your case to your agency?
  confirmacionUsuario: 'I confirm option {descripcion}'
  reprogramadoOk: >-
    Done, your booking {numeroReserva} has been rescheduled to {inicio}. You will see it updated on
    your dashboard.
  opcionRechazada: >-
    The provider no longer offers that option. Would you like me to escalate your case to your
    agency?
  consultandoOpciones: I'm checking with the airline. I'll show the options as soon as they arrive.
  consultandoAplicar: I'm confirming the change with the airline. I'll let you know as soon as it responds.
  derivadoOk: >-
    I forwarded your request and the summary of this conversation to {agencia}. Your case number is
    {numeroCaso}.
  sinAgenciaPreferida: >-
    You haven't selected a preferred travel agency in your profile yet. Please set one in
    Preferences so I can escalate your case.
  noDisponibleEstado: >-
    I can't check your trips right now. Would you like me to escalate your request to your agency?
  noDisponibleReprogramar: >-
    I can't reschedule bookings right now. Nothing was changed. Would you like me to escalate your
    case to your agency?
  noDisponibleDerivar: >-
    I couldn't reach your agency right now. Please try again in a few minutes or use the "Contact my
    agency" button.
