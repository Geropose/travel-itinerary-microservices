# Respuestas configuradas del plug-in de problemas menores (sin llamadas a otros servicios).
problemasMenores:
  equipaje:
    palabrasClave:
      - equipaje
      - valija
      - maleta
      - bolso
      - carry on
    respuesta: >-
      En cabina podés llevar un bolso de hasta 8 kg. El equipaje despachado depende de la tarifa; lo
      ves en el correo de tu reserva.
  checkIn:
    palabrasClave:
      - check-in
      - checkin
      - check in
      - tarjeta de embarque
      - boarding pass
      - asiento
    respuesta: >-
      El check-in online suele abrir entre 24 y 48 horas antes de la salida en la web de tu
      aerolínea usando tu código de reserva.
  compartir:
    palabrasClave:
      - compartir
      - comparto
      - designado
      - red social
    respuesta: >-
      Podés compartir un viaje desde su detalle en el panel: agregá el email de una persona
      designada para darle acceso de solo lectura, o publicalo en tu red social sin códigos de
      reserva.
  archivar:
    palabrasClave:
      - archivar
      - archivo
      - archiva
      - archivan
      - archivado
      - archivados
      - viaje pasado
      - viajes pasados
    respuesta: >-
      No hace falta archivar a mano: los viajes se archivan automáticamente cuando termina su última
      reserva (en la tarea nocturna) y pasan a la pestaña Archivados en modo solo lectura.
  correo:
    palabrasClave:
      - conectar correo
      - sincronizar correo
      - gmail
      - outlook
      - buzon
    respuesta: >-
      Desde la pestaña Correo podés conectar Gmail u Outlook con permiso de solo lectura (OAuth).
      Trotamundos detecta tus reservas automáticamente y nunca guarda la contraseña de tu correo.
  whitelist:
    palabrasClave:
      - whitelist
      - filtro
      - filtros
      - remitente
      - remitentes
    respuesta: >-
      En la pestaña Whitelist podés activar filtros y elegir qué remitentes o dominios (por ejemplo
      @aerolinea-andina.example) querés que se procesen al leer tu correo.
  offline:
    palabrasClave:
      - sin internet
      - sin conexion
      - offline
      - modo avion
    respuesta: >-
      Trotamundos guarda en tu dispositivo el último panel cargado, así que podés abrir la app sin
      conexión y consultar tus reservas activas igual.
  gestionManual:
    palabrasClave:
      - agregar reserva
      - cargar reserva
      - crear reserva
      - editar reserva
      - borrar reserva
      - eliminar reserva
    respuesta: >-
      En la pantalla Panel tenés el botón para agregar una reserva manualmente y, dentro de cada
      tarjeta, las opciones para editarla o eliminarla.
  quienSos:
    palabrasClave:
      - quien sos
      - que sos
      - que podes hacer
      - que sabes hacer
      - en que me podes ayudar
      - para que servis
    respuesta: >-
      ¡Hola! Soy el asistente virtual de Trotamundos. Podés pedirme que revise el estado de tus
      viajes (ej. "¿Cómo está mi vuelo?"), busque opciones para reprogramar un vuelo, te ayude con
      dudas sobre equipaje, check-in, correo o viajes archivados, o derive tu consulta a tu agencia.
  comoEstas:
    palabrasClave:
      - como estas
      - como andas
      - todo bien
      - que tal
    respuesta: >-
      ¡Todo muy bien por acá, gracias por preguntar! ¿En qué te puedo ayudar hoy con tus viajes o
      reservas?
  despedida:
    palabrasClave:
      - chau
      - chao
      - adios
      - hasta luego
      - nos vemos
    respuesta: >-
      ¡Hasta luego! Buen viaje, y si necesitás algo más con tus reservas, escribime cuando quieras.
  gracias:
    palabrasClave:
      - gracias
      - muchas gracias
      - mil gracias
      - te agradezco
      - genial
      - barbaro
      - joya
      - excelente
      - perfecto
      - listo
    respuesta: >-
      ¡De nada! Si necesitás consultar otra reserva, reprogramar un vuelo o hablar con tu agencia,
      acá estoy.
  saludo:
    palabrasClave:
      - hola
      - holis
      - buenas
      - buen dia
      - buenos dias
      - buenas tardes
      - buenas noches
      - hey
      - ey
    respuesta: >-
      ¡Hola! ¿Cómo te puedo ayudar hoy? Podés consultarme el estado de tus vuelos o reservas,
      reprogramar un vuelo, preguntarme sobre equipaje o check-in, o pedir hablar con tu agencia.
  general:
    palabrasClave:
      - ayuda
    respuesta: >-
      Puedo consultar el estado de tus reservas, buscar opciones para reprogramar vuelos, responder
      dudas sobre equipaje, check-in, correo, whitelist o viajes archivados, o derivar tu caso a tu
      agencia.

textos:
  saludo: Hola, soy el asistente de Trotamundos. ¿En qué te ayudo?
  repregunta: >-
    No llegué a entenderte. Podés preguntarme por el estado de tus vuelos o reservas, pedir
    reprogramar un vuelo, consultar sobre equipaje o check-in, o pedirme que te derive a tu agencia.
  derivacionAutomaticaMotivo: >-
    El asistente no pudo comprender la consulta del usuario tras dos intentos consecutivos.
  sinReservas: No encontré reservas activas en tu cuenta en este momento.
  reservaNoEncontrada: No encontré la reserva {numeroReserva} entre tus viajes activos.
  estadoEncabezado: 'Estas son tus reservas activas:'
  estadoUnicaReserva: 'Tu {tipo} {numeroReserva} ({ruta}) inicia el {inicio} y está {estado}.'
  pedirNumeroReprogramacion: >-
    Tenés varias reservas activas. Indicame el código de reserva del vuelo que querés reprogramar
    (por ejemplo: {ejemplo}).
  reprogramacionSinReservas: No encontré reservas activas para reprogramar en tu cuenta.
  opcionesEncontradas: La aerolínea ofrece estas opciones. ¿Cuál querés confirmar?
  sinOpcionesReprogramacion: >-
    No encontré opciones de reprogramación disponibles con el proveedor para {numeroReserva}.
    ¿Querés que derive tu caso a tu agencia?
  confirmacionUsuario: 'Confirmo la opción {descripcion}'
  reprogramadoOk: >-
    Listo, tu reserva {numeroReserva} quedó reprogramada para el {inicio}. Lo vas a ver actualizado
    en tu panel.
  opcionRechazada: >-
    El proveedor ya no ofrece esa opción. ¿Querés que derive tu caso a tu agencia?
  consultandoOpciones: Estoy consultando con la aerolínea. Te muestro las opciones en cuanto lleguen.
  consultandoAplicar: Estoy confirmando el cambio con la aerolínea. Te aviso en cuanto responda.
  derivadoOk: >-
    Le pasé tu consulta y el resumen de esta conversación a {agencia}. Tu número de caso es
    {numeroCaso}.
  sinAgenciaPreferida: >-
    Todavía no elegiste una agencia preferida en tu perfil. Configurala en Preferencias para que
    pueda derivar tu consulta.
  noDisponibleEstado: >-
    Ahora no puedo consultar tus viajes. ¿Querés que derive tu consulta a tu agencia?
  noDisponibleReprogramar: >-
    Ahora no puedo reprogramar reservas. No se cambió nada. ¿Querés que derive tu caso a tu agencia?
  noDisponibleDerivar: >-
    Ahora no pude comunicarme con tu agencia. Intentá de nuevo en unos minutos o usá el botón
    "Contactar a mi agencia".
