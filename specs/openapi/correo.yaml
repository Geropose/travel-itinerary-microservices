# Contrato REST del Servicio de Correo (dueño B, puerto 3003).
# Trazabilidad con la wiki:
#   - Iteración 2 y ADR-010: Examinador y avisos push de los proveedores de correo.
#   - Iteración 3 y ADR-003: adaptadores de correo (uno por proveedor).
#   - Iteración 5 y ADR-015: tokens de correo (OAuth de solo lectura) y filtro de remitentes.
# Formatos externos: specs/externos/gmail.md, specs/externos/outlook.md y specs/externos/correos-reserva.md.
openapi: 3.1.0
info:
  title: Trotamundos — Servicio de Correo
  version: 0.1.0
  description: >-
    Conecta los buzones de los usuarios con permiso OAuth de solo lectura (ADR-015), recibe los
    avisos de correos nuevos de Gmail y Outlook (ADR-010) y expone los correos de viaje que los
    procesadores no pudieron interpretar (medición del 99 % de QA-6 y QA-7). El Examinador, los
    procesadores y el filtro de remitentes no tienen rutas propias: trabajan con colas y eventos
    (specs/asyncapi/eventos.yaml).

    Rutas públicas (sin JWT): GET /health, GET /oauth/callback, POST /notificaciones/gmail y
    POST /notificaciones/outlook. Cada una explica cómo se verifica quién la llama.
servers:
  - url: http://localhost:8000/api/correo
    description: Público, entra por el enrutador global y el API Gateway.
  - url: http://correo:3003
    description: Interno, dentro de la red de la región.
security:
  - bearerJWT: []
tags:
  - name: cuentas-correo
    description: Cuentas de correo conectadas con OAuth de solo lectura (Tokens de correo, Iteración 5).
  - name: oauth
    description: Vuelta del navegador desde la pantalla de permiso del proveedor de correo (ADR-015).
  - name: notificaciones
    description: >-
      Avisos de correos nuevos que mandan los proveedores de correo (Adaptadores de correo, Iteración 3;
      ADR-010). Los llama el proveedor, no el usuario.
  - name: no-procesados
    description: Correos de viaje que los procesadores no pudieron interpretar (QA-6 y QA-7).
  - name: salud
    description: Estado del servicio para el monitor de salud (ADR-007).

paths:
  /health:
    get:
      operationId: consultarSalud
      summary: Estado del servicio
      description: >-
        Responde 200 si el servicio puede atender (base y broker conectados) y 503 si no
        (docs/CONVENCIONES.md 4.3). Lo usa el monitor de salud (ADR-007).
      tags: [salud]
      security: []
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Salud'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /cuentas-correo:
    get:
      operationId: listarCuentasCorreo
      summary: Cuentas de correo conectadas del usuario
      description: >-
        Devuelve las cuentas de correo que el usuario del JWT conectó, con su estado y la fecha de la
        última revisión del buzón. Nunca devuelve los tokens (están encriptados, ADR-015).
      tags: [cuentas-correo]
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
      responses:
        '200':
          description: Cuentas del usuario (lista vacía si no conectó ninguna).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCuentasCorreo'
              example:
                cuentas:
                  - id: 3b1f0c9e-6a2d-4f5b-9c8e-1a2b3c4d5e6f
                    proveedor: gmail
                    email: ana.garcia@gmail.com
                    estado: conectada
                    conectadaEn: '2026-11-28T12:00:05Z'
                    ultimaRevision: '2026-11-28T12:12:35Z'
                  - id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    proveedor: outlook
                    email: ana.garcia@outlook.com
                    estado: sin-permiso
                    conectadaEn: '2026-11-20T09:30:00Z'
                    ultimaRevision: '2026-11-27T22:00:00Z'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/Prohibido'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /cuentas-correo/{proveedor}/conectar:
    post:
      operationId: conectarCuentaCorreo
      summary: Empezar a conectar una cuenta de correo
      description: >-
        Arma la URL de la pantalla de permiso del proveedor con el scope de solo lectura
        (`gmail.readonly` en Gmail; `offline_access Mail.Read User.Read` en Outlook) y un `state` firmado por el
        Servicio de Correo. El `state` lleva el usuarioId, la región, el proveedor y un nonce de un solo
        uso, y vence a los 10 minutos. La web redirige al usuario a `urlAutorizacion`; al volver, el
        proveedor llama a GET /oauth/callback. Trotamundos nunca pide ni guarda la contraseña del
        correo (QA-8). No tiene cuerpo.
      tags: [cuentas-correo]
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: proveedor
          in: path
          required: true
          description: Proveedor de correo. Cada uno tiene su adaptador (ADR-003).
          schema:
            $ref: '#/components/schemas/ProveedorCorreo'
          example: gmail
      responses:
        '200':
          description: URL de autorización a la que la web tiene que redirigir al usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutorizacionCorreo'
              examples:
                gmail:
                  summary: Gmail (mock en el puerto 4001)
                  value:
                    proveedor: gmail
                    urlAutorizacion: http://localhost:4001/o/oauth2/v2/auth?client_id=trotamundos-local.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fregion-1%2Fapi%2Fcorreo%2Foauth%2Fcallback&response_type=code&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fgmail.readonly&access_type=offline&include_granted_scopes=true&state=eyJ1IjoiNmIxZTdjMmEiLCJyIjoicmVnaW9uLTEifQ.firma
                    stateVenceEn: '2026-11-28T12:10:00Z'
                outlook:
                  summary: Outlook (mock en el puerto 4002)
                  value:
                    proveedor: outlook
                    urlAutorizacion: http://localhost:4002/common/oauth2/v2.0/authorize?client_id=11112222-bbbb-3333-cccc-4444dddd5555&response_type=code&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fregion-1%2Fapi%2Fcorreo%2Foauth%2Fcallback&response_mode=query&scope=offline_access%20https%3A%2F%2Fgraph.microsoft.com%2FMail.Read%20https%3A%2F%2Fgraph.microsoft.com%2FUser.Read&state=eyJ1IjoiNmIxZTdjMmEiLCJyIjoicmVnaW9uLTEifQ.firma
                    stateVenceEn: '2026-11-28T12:10:00Z'
        '400':
          $ref: './comun.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/Prohibido'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /cuentas-correo/{id}:
    delete:
      operationId: desconectarCuentaCorreo
      summary: Desconectar una cuenta de correo
      description: >-
        Borra el token guardado de la cuenta, da de baja los avisos push (Gmail `watch` o la
        suscripción de Microsoft Graph) y saca el buzón del Examinador. Las reservas que ya llegaron al
        Servicio de Viajes no se tocan. Solo el dueño de la cuenta puede desconectarla; si la cuenta es
        de otro usuario responde 404 para no revelar que existe.
      tags: [cuentas-correo]
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          description: Id de la cuenta de correo (campo `id` de GET /cuentas-correo).
          schema:
            type: string
            format: uuid
          example: 3b1f0c9e-6a2d-4f5b-9c8e-1a2b3c4d5e6f
      responses:
        '204':
          description: Cuenta desconectada y token borrado.
        '400':
          $ref: './comun.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/Prohibido'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /oauth/callback:
    get:
      operationId: completarConexionOAuth
      summary: Vuelta desde la pantalla de permiso del proveedor
      description: >-
        Pública: la llama el navegador del usuario cuando el proveedor de correo lo redirige
        (`redirect_uri`), así que no trae JWT. Cada región registra su propio `redirect_uri` con el
        prefijo de región del enrutador global (por ejemplo
        `http://localhost:8000/region-1/api/correo/oauth/callback`, gateway.yaml), así la vuelta
        llega a la región del usuario. El usuario se identifica por el `state`: se verifica la
        firma, el vencimiento y que el nonce no se haya usado; si falla, responde 400 y no se conecta
        nada. Con un `state` válido, el adaptador del proveedor canjea `code` por los tokens,
        comprueba que el scope concedido incluya el de solo lectura, guarda los tokens encriptados con
        AES-256-GCM, activa los avisos push y deja la cuenta con prioridad máxima para el Examinador
        (se revisa en el primer minuto, QA-7). Siempre termina redirigiendo a la pantalla Correo de la
        web, con el resultado en la query: `resultado=conectada&cuentaId=<uuid>` o
        `resultado=error&motivo=<motivo>`, donde motivo es `permiso-denegado` (el usuario rechazó),
        `scope-insuficiente`, `codigo-invalido` (`invalid_grant`), `cuenta-de-otro-usuario` o
        `proveedor-no-disponible`. Los nombres de los parámetros son los del proveedor (OAuth 2.0).
      tags: [oauth]
      security: []
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: state
          in: query
          required: true
          description: El mismo `state` firmado que se mandó en la URL de autorización.
          schema:
            type: string
            minLength: 1
          example: eyJ1IjoiNmIxZTdjMmEiLCJyIjoicmVnaW9uLTEifQ.firma
        - name: code
          in: query
          required: false
          description: Código de autorización. Viene si el usuario dio el permiso.
          schema:
            type: string
            minLength: 1
          example: 4/P7q7W91a-oMsCeLvIaQm6bTrgtp7
        - name: scope
          in: query
          required: false
          description: Scopes concedidos (solo Gmail lo manda en la redirección). Se vuelve a comprobar con la respuesta del canje.
          schema:
            type: string
          example: https://www.googleapis.com/auth/gmail.readonly
        - name: error
          in: query
          required: false
          description: Viene en lugar de `code` si el usuario rechazó el permiso (`access_denied`) u otro error OAuth.
          schema:
            type: string
          example: access_denied
        - name: error_description
          in: query
          required: false
          description: Texto libre del proveedor (Outlook). Solo para los logs.
          schema:
            type: string
          example: the user canceled the authentication
      responses:
        '302':
          description: Redirección a la pantalla Correo de la web con el resultado de la conexión.
          headers:
            Location:
              description: URL de la web (configurada por entorno) con `resultado` y `cuentaId` o `motivo`.
              required: true
              schema:
                type: string
                format: uri
              examples:
                conectada:
                  value: http://localhost:5173/correo?resultado=conectada&cuentaId=3b1f0c9e-6a2d-4f5b-9c8e-1a2b3c4d5e6f
                rechazada:
                  value: http://localhost:5173/correo?resultado=error&motivo=permiso-denegado
        '400':
          description: El `state` falta, tiene la firma mal, venció o ya se usó. No se conecta ninguna cuenta.
          content:
            application/problem+json:
              schema:
                $ref: './comun.yaml#/components/schemas/Problema'
              example:
                type: https://trotamundos.example/errores/state-invalido
                title: State inválido
                status: 400
                detail: El state venció o ya se usó. Volvé a conectar la cuenta.
                requestId: 7f3c1e2a-9b4d-4c6e-8a1f-2d3e4f5a6b7c
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /notificaciones/gmail:
    post:
      operationId: recibirAvisoGmail
      summary: Aviso push de Gmail (formato Pub/Sub)
      description: >-
        Pública: la llama Google Cloud Pub/Sub (en el prototipo, el mock de Gmail) cuando entra un
        correo a un buzón con `watch` activo (specs/externos/gmail.md, sección 6). El cuerpo usa los
        nombres originales de Google. El aviso no trae el correo: `message.data` decodificado solo dice
        qué buzón cambió (`emailAddress`) y su `historyId` nuevo. El adaptador busca la cuenta por
        `emailAddress`, encola el buzón para el Examinador (cola correo.buzones-a-revisar, ADR-010) y
        responde enseguida; los procesadores llaman después a `history.list`. Cada región crea su
        `watch` con su propia URL de avisos, con el prefijo de región del enrutador global
        (`/region-1/api/correo/notificaciones/gmail`), así el aviso llega a la región del buzón.

        Verificación: la URL de avisos configurada en la suscripción push lleva un secreto en la query
        (`?token=<secreto>`, como recomienda Pub/Sub para endpoints push); si no coincide con el
        configurado por entorno responde 401. También se comprueba que `subscription` sea la
        configurada. Un `messageId` repetido o un `emailAddress` sin cuenta conectada se aceptan (202)
        y se ignoran, para que Pub/Sub no reintente. Si no se puede encolar responde 503 y Pub/Sub
        reintenta más tarde.
      tags: [notificaciones]
      security: []
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: token
          in: query
          required: true
          description: Secreto compartido de la suscripción push, configurado por entorno. Nunca se loguea.
          schema:
            type: string
            minLength: 16
          example: c2VjcmV0by1kZS1lamVtcGxvLXB1c2g
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisoPushGmail'
            example:
              message:
                data: eyJlbWFpbEFkZHJlc3MiOiJhbmEuZ2FyY2lhQGdtYWlsLmNvbSIsImhpc3RvcnlJZCI6Ijk4NzY1NDMyMTAifQ==
                messageId: '2070443601311540'
                message_id: '2070443601311540'
                publishTime: '2026-11-28T12:12:31.749Z'
                publish_time: '2026-11-28T12:12:31.749Z'
              subscription: projects/trotamundos/subscriptions/gmail-avisos-push
      responses:
        '202':
          description: Aviso aceptado (Pub/Sub lo toma como confirmado). El buzón quedó encolado o el aviso se ignoró por repetido.
        '400':
          $ref: './comun.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/AvisoNoVerificado'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /notificaciones/outlook:
    post:
      operationId: recibirAvisoOutlook
      summary: Validación y avisos de Microsoft Graph
      description: >-
        Pública: la llama Microsoft Graph (en el prototipo, el mock de Outlook). Cada región crea la
        suscripción con su propia URL, con el prefijo de región del enrutador global
        (`/region-1/api/correo/notificaciones/outlook`), así el aviso llega a la región del buzón. Atiende dos casos
        (specs/externos/outlook.md, secciones 4.2 y 5), con los nombres originales de Microsoft:

        1. Validación de la URL al crear la suscripción: viene `validationToken` en la query y un cuerpo
        `text/plain` vacío. Responde 200 `text/plain` con el token decodificado, sin cambios, dentro de
        10 segundos.

        2. Change notifications: cuerpo JSON con `value`. Responde 202 dentro de 3 segundos y procesa
        después: encola el buzón para el Examinador (ADR-010) y los procesadores leen cada mensaje por
        `resourceData.id`.

        Verificación: cada aviso trae el `clientState` secreto que el Servicio de Correo eligió al crear
        la suscripción de esa cuenta. Se compara con el guardado para su `subscriptionId`; los avisos
        que no coinciden o de suscripciones desconocidas se descartan (y se loguean), pero la respuesta
        sigue siendo 202 como pide Microsoft. Si no se puede encolar responde 503 y Graph reintenta.
      tags: [notificaciones]
      security: []
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: validationToken
          in: query
          required: false
          description: Solo en la validación de la URL. Token opaco; se devuelve decodificado en el cuerpo.
          schema:
            type: string
          example: 'token opaco: f2b1d6a0'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisosGraph'
            example:
              value:
                - id: lsgTZMr9KwAAA
                  subscriptionId: 7f105c7d-2dc5-4530-97cd-4e7ae6534c07
                  subscriptionExpirationDateTime: '2026-12-05T12:00:00Z'
                  clientState: secreto-aleatorio-de-la-cuenta
                  changeType: created
                  resource: Users/6b1e7c2a-4f3d-4e8b-9c0a-1d2e3f4a5b6c/Messages/AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZiLTU1OGY5OTZhYmY4OABGAAAAAAAiQ8W967B7TKBjgx9rVEURBwAiIsqMbYjsT5e-T7KzowPTAAAAAAEMAAAiIsqMbYjsT5e-T7KzowPTAAAYbvZDAAA=
                  tenantId: 84bd8158-6d4d-4958-8b9f-9d6445542f95
                  resourceData:
                    '@odata.type': '#Microsoft.Graph.Message'
                    '@odata.id': Users/6b1e7c2a-4f3d-4e8b-9c0a-1d2e3f4a5b6c/Messages/AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZiLTU1OGY5OTZhYmY4OABGAAAAAAAiQ8W967B7TKBjgx9rVEURBwAiIsqMbYjsT5e-T7KzowPTAAAAAAEMAAAiIsqMbYjsT5e-T7KzowPTAAAYbvZDAAA=
                    '@odata.etag': W/"CQAAABYAAADkrWGo7bouTKlsgTZMr9KwAAAUWRHf"
                    id: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZiLTU1OGY5OTZhYmY4OABGAAAAAAAiQ8W967B7TKBjgx9rVEURBwAiIsqMbYjsT5e-T7KzowPTAAAAAAEMAAAiIsqMbYjsT5e-T7KzowPTAAAYbvZDAAA=
          text/plain:
            schema:
              type: string
              maxLength: 0
              description: Cuerpo vacío de la validación de la URL.
            example: ''
      responses:
        '200':
          description: Respuesta a la validación de la URL. El cuerpo es el `validationToken` decodificado, en texto plano.
          content:
            text/plain:
              schema:
                type: string
              example: 'token opaco: f2b1d6a0'
        '202':
          description: Avisos aceptados. Los válidos quedaron encolados; los que no pasaron la verificación de `clientState` se descartaron.
        '400':
          $ref: './comun.yaml#/components/responses/SolicitudInvalida'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /no-procesados:
    get:
      operationId: listarNoProcesados
      summary: Correos de viaje que no se pudieron interpretar
      description: >-
        Correos de viaje del usuario del JWT que los procesadores no pudieron traducir a
        `ReservaDetectada` (tabla no_procesados, P2.B6). Sirve para medir el 99 % sin intervención
        manual de QA-6 y QA-7: detectados = correos de viaje del lote - `total`. Se guardan solo los
        metadatos del correo, nunca el cuerpo. Los correos que no son de viaje y los de remitentes
        fuera de la whitelist no aparecen. Ordenados por `registradoEn`, del más nuevo al más viejo.
      tags: [no-procesados]
      parameters:
        - $ref: './comun.yaml#/components/parameters/XRequestId'
        - name: desde
          in: query
          required: false
          description: Solo los registrados desde esta fecha (inclusive).
          schema:
            type: string
            format: date-time
          example: '2026-11-28T00:00:00Z'
        - name: cuentaId
          in: query
          required: false
          description: Solo los de esta cuenta de correo.
          schema:
            type: string
            format: uuid
          example: 3b1f0c9e-6a2d-4f5b-9c8e-1a2b3c4d5e6f
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de elementos en `noProcesados`. `total` cuenta todos igual.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 100
      responses:
        '200':
          description: Correos no procesados del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaNoProcesados'
              example:
                total: 1
                noProcesados:
                  - id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    cuentaId: 3b1f0c9e-6a2d-4f5b-9c8e-1a2b3c4d5e6f
                    proveedorCorreo: gmail
                    correoId: 18c4f1b2a0c4d002
                    remitente: reservas@hotel-cordillera.example
                    asunto: Hotel Cordillera - Cambio de fechas
                    recibidoEn: '2026-11-28T12:20:00Z'
                    registradoEn: '2026-11-28T12:20:04Z'
                    motivo: sin-regla
                    detalle: No hay marcado JSON-LD y el texto no coincide con ninguna plantilla.
        '400':
          $ref: './comun.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/Prohibido'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

components:
  securitySchemes:
    bearerJWT:
      $ref: './comun.yaml#/components/securitySchemes/bearerJWT'

  responses:
    AvisoNoVerificado:
      description: >-
        El aviso no pasó la verificación (falta el secreto de la URL de avisos o no coincide). No se
        encola nada.
      content:
        application/problem+json:
          schema:
            $ref: './comun.yaml#/components/schemas/Problema'
          example:
            type: https://trotamundos.example/errores/aviso-no-verificado
            title: Aviso no verificado
            status: 401
            requestId: 7f3c1e2a-9b4d-4c6e-8a1f-2d3e4f5a6b7c

  schemas:
    ProveedorCorreo:
      type: string
      description: >-
        Proveedor de correo. No confundir con `Proveedor` (aerolínea, hotel o rentadora) de los
        eventos. Agregar uno nuevo es agregar un adaptador (ADR-003).
      enum: [gmail, outlook]

    EstadoCuentaCorreo:
      type: string
      description: >-
        `conectada`: el token sirve y el Examinador revisa el buzón. `sin-permiso`: el proveedor
        rechazó el token (`invalid_grant`, por ejemplo porque el usuario quitó el permiso); el usuario
        tiene que volver a conectar la cuenta (ADR-015, consecuencia "Malo").
      enum: [conectada, sin-permiso]

    CuentaCorreo:
      type: object
      additionalProperties: false
      required: [id, proveedor, email, estado, conectadaEn, ultimaRevision]
      properties:
        id:
          type: string
          format: uuid
        proveedor:
          $ref: '#/components/schemas/ProveedorCorreo'
        email:
          type: string
          format: email
          description: >-
            Dirección del buzón conectado. La pide el adaptador después del canje del código: Gmail
            `GET /gmail/v1/users/me/profile` (`emailAddress`) y Outlook `GET /v1.0/me` (`mail` o, si
            viene vacío, `userPrincipalName`); ver specs/externos.
        estado:
          $ref: '#/components/schemas/EstadoCuentaCorreo'
        conectadaEn:
          type: string
          format: date-time
          description: Cuándo se dio el permiso por última vez.
        ultimaRevision:
          type: [string, 'null']
          format: date-time
          description: Última vez que un procesador leyó el buzón. `null` si todavía no se revisó.

    ListaCuentasCorreo:
      type: object
      additionalProperties: false
      required: [cuentas]
      properties:
        cuentas:
          type: array
          items:
            $ref: '#/components/schemas/CuentaCorreo'

    AutorizacionCorreo:
      type: object
      additionalProperties: false
      required: [proveedor, urlAutorizacion, stateVenceEn]
      properties:
        proveedor:
          $ref: '#/components/schemas/ProveedorCorreo'
        urlAutorizacion:
          type: string
          format: uri
          description: Pantalla de permiso del proveedor, con scope de solo lectura y el `state` firmado.
        stateVenceEn:
          type: string
          format: date-time
          description: Hasta cuándo se acepta la vuelta a GET /oauth/callback con ese `state`.

    MotivoNoProcesado:
      type: string
      description: >-
        `sin-regla`: no hay JSON-LD y el texto no coincide con ninguna plantilla.
        `marcado-invalido`: hay JSON-LD de reserva pero no se puede leer o le faltan datos obligatorios
        de ReservaDetectada. `estado-no-confirmado`: la reserva viene cancelada o en espera
        (ReservaDetectada no tiene estado; ver specs/externos/correos-reserva.md).
        `proveedor-desconocido`: el dominio del remitente no está en la tabla dominio → proveedor.
      enum: [sin-regla, marcado-invalido, estado-no-confirmado, proveedor-desconocido]

    NoProcesado:
      type: object
      additionalProperties: false
      required:
        [id, cuentaId, proveedorCorreo, correoId, remitente, recibidoEn, registradoEn, motivo]
      properties:
        id:
          type: string
          format: uuid
        cuentaId:
          type: string
          format: uuid
          description: Cuenta de correo donde llegó.
        proveedorCorreo:
          $ref: '#/components/schemas/ProveedorCorreo'
        correoId:
          type: string
          minLength: 1
          description: Id del correo en el proveedor (el mismo campo `correoId` de ReservaDetectada).
        remitente:
          type: string
          format: email
        asunto:
          type: string
        recibidoEn:
          type: string
          format: date-time
        registradoEn:
          type: string
          format: date-time
          description: Cuándo el procesador lo dejó en no_procesados.
        motivo:
          $ref: '#/components/schemas/MotivoNoProcesado'
        detalle:
          type: string
          description: Explicación del procesador, para revisar el caso a mano.

    ListaNoProcesados:
      type: object
      additionalProperties: false
      required: [total, noProcesados]
      properties:
        total:
          type: integer
          minimum: 0
          description: Cantidad total que cumple los filtros, aunque `noProcesados` traiga menos por `limite`.
        noProcesados:
          type: array
          items:
            $ref: '#/components/schemas/NoProcesado'

    AvisoPushGmail:
      type: object
      description: >-
        Mensaje push de Cloud Pub/Sub, con los nombres originales de Google. Admite campos extra
        (`attributes`, `deliveryAttempt`, etc.): Google pide ignorar los que no se conocen, por eso no
        lleva additionalProperties false.
      additionalProperties: true
      required: [message, subscription]
      properties:
        message:
          type: object
          additionalProperties: true
          required: [data, messageId]
          properties:
            data:
              type: string
              description: >-
                JSON de DatosAvisoGmail en base64 (Pub/Sub) o base64url (guía de Gmail); se aceptan los
                dos alfabetos.
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema:
                $ref: '#/components/schemas/DatosAvisoGmail'
            messageId:
              type: string
              description: Id de Pub/Sub (no del correo). Puede llegar repetido; el repetido se ignora.
            message_id:
              type: string
            publishTime:
              type: string
              format: date-time
            publish_time:
              type: string
              format: date-time
        subscription:
          type: string
          description: Suscripción push de Pub/Sub. Tiene que ser la configurada.

    DatosAvisoGmail:
      type: object
      description: Contenido de `message.data` decodificado (specs/externos/gmail.md, sección 6).
      additionalProperties: true
      required: [emailAddress, historyId]
      properties:
        emailAddress:
          type: string
          format: email
          description: Buzón que cambió.
        historyId:
          type: string
          description: historyId nuevo del buzón. Los procesadores llaman a history.list desde el último guardado.
      example:
        emailAddress: ana.garcia@gmail.com
        historyId: '9876543210'

    AvisosGraph:
      type: object
      description: >-
        Colección de change notifications de Microsoft Graph, con los nombres originales. Admite
        campos extra (Microsoft pide ignorar los que no se conocen).
      additionalProperties: true
      required: [value]
      properties:
        value:
          type: array
          minItems: 1
          description: Puede traer varios avisos, incluso de suscripciones distintas.
          items:
            $ref: '#/components/schemas/AvisoGraph'

    AvisoGraph:
      type: object
      additionalProperties: true
      required: [subscriptionId, changeType, resource, resourceData]
      properties:
        id:
          type: string
        subscriptionId:
          type: string
          format: uuid
          description: Suscripción de la cuenta. Con ella se busca la cuenta y su clientState.
        subscriptionExpirationDateTime:
          type: string
          format: date-time
          description: Vencimiento de la suscripción; el servicio la renueva antes.
        clientState:
          type: string
          description: Secreto de la suscripción. Si falta o no coincide con el guardado, el aviso se descarta.
        changeType:
          type: string
          enum: [created, updated, deleted]
        resource:
          type: string
        tenantId:
          type: string
          format: uuid
        resourceData:
          type: object
          additionalProperties: true
          required: [id]
          properties:
            '@odata.type':
              type: string
            '@odata.id':
              type: string
            '@odata.etag':
              type: string
            id:
              type: string
              description: Id del mensaje. El procesador lo lee con GET /v1.0/me/messages/{id}.
