# Reglas de @redocly/cli para los contratos REST de specs/openapi/.
extends:
  - recommended

rules:
  # El prototipo no publica licencia ni servidores de producción.
  info-license: off
  no-server-example.com: off
  # Las rutas públicas van con security: []. Las internas reciben el JWT del usuario propagado
  # (ADR-019) o, si no hay usuario (registro, tareas programadas, pruebas), el token de servicio.
  security-defined: warn
